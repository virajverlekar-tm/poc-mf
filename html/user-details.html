<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Loans</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <style>
            body {
                background: transparent;
            }
            .user-details-card {
                border-radius: 16px;
                padding: 8px;
            }
            .user-fname {
                text-align: center;
                margin-top: 20px;
                text-transform: uppercase;
                font-weight: 700;
                color: #121617;
                font-size: 18px;
                line-height: 24px;
            }

            .loader {
                width: 28px;
                height: 28px;
                border: 3px solid             #009F69;
                border-bottom-color: transparent;
                border-radius: 50%;
                display: inline-block;
                box-sizing: border-box;
                animation: rotation 1s linear infinite;
            }

            @keyframes rotation {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .loader.hide {
                display: none;
            }
            @keyframes l13{ 
                100%{transform: rotate(1turn)}
            }
            .loader-wrapper {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                justify-content: center;                
            }
            .container {
                display: none;
            }
            #response-output {
                font-size: 20px;
            }

            .heading{
                font-weight: 500;
                color: #121617;
                font-size: 16px;
                line-height: 24px;
            }
            .subheading{
                font-weight: 400;
                color: #606060;
                font-size: 12px;
                line-height: 17px;
            }
            .buttonDark {
                background: #191C1B;
                border-radius: 8px;
                padding: 10px 12px;
                min-height: 48px;
                color: #fff;
                font-size: 16px;
                font-weight: 500;
                text-align: center;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>

    <body>
        <div style="font-family: 'Roboto', sans-serif; padding: 20px 25px 25px" class="container">
            <h5 class="text-center heading">My Profile - Fetched from API</h5>
            <h4 class="user-fname"></h4>
            <p class="user-phone text-center subheading"></p>
            <div class="go-to-btn text-center buttonDark">Go to Insurance List</div>
        </div>
        <div class="loader-wrapper">
            <div class="loader"></div>
        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
            integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
            crossorigin="anonymous"
        ></script>
        <script>
            function readyFn () {    
                const hostUrl = window.hostUrl;
                const token = window.token;

                $.ajax({
                    url: `${hostUrl}/api/ca/v1/self/user`,
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    success: function(response) {
                        $('.user-fname').text(response.fullName);
                        $('.user-phone').text('+91 ' + response.mobile);
                        $('.container').show();
                        $('.loader-wrapper').hide();
                    },
                    error: function(xhr, status, error) {
                        window.ReactNativeWebView.postMessage('{"type":"error"}');
                    }
                });

                $(".go-to-btn").click(function(){
                   window.ReactNativeWebView.postMessage('{"type":"redirect","goto":"insurance-details"}');
                });
            };
            
        </script>
    </body>
</html>
